[workspace]
members = [
    "crates/nemesis-core",
    "crates/nemesis-agent",
    "crates/nemesis-sdd",
    "crates/nemesis-integrations",
    "crates/nemesis-cli",
]
resolver = "2"

[profile.dev]
incremental = false

[profile.release]
incremental = false

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.11", features = ["serde", "v4"] }
